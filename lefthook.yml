# Git hooks, installed by `npm install` (via the "prepare" script).
# Skip once with `git commit --no-verify` / `LEFTHOOK=0 git push`.
pre-commit:
  parallel: true
  jobs:
    - name: block env files
      run: |
        bad=$(git diff --cached --name-only --diff-filter=ACMR | grep -E '(^|/)\.env' | grep -vE '(^|/)\.env\.(example|development|e2e|test)$' || true)
        if [ -n "$bad" ]; then echo "Refusing to commit env files:"; echo "$bad"; exit 1; fi
    - name: lint
      glob: '*.{js,jsx,ts,tsx}'
      run: npx eslint --max-warnings=0 --no-warn-ignored {staged_files}
    - name: format
      glob: '*.{js,jsx,ts,tsx,json,css,md,yml,yaml,html}'
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: unit tests
      run: npm test
